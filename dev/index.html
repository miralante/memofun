<!DOCTYPE html>
<!-- ============================================================================
     Memofun — /dev/ : espejo de la portada con acceso completo.

     Página hardcodeada NO: esta página CARGA app.js exactamente igual que
     la portada pública. Lo único que cambia es el body:

         • data-access="full"  → todos los cursos y todas las asignaturas
                                 se pueden abrir, incluidos los que la
                                 portada pública muestra bloqueados con
                                 "Próximamente".
         • data-app-base="../"  → los enlaces que construye app.js (manifest,
                          cursos, visor de tarjetas) se resuelven desde
                          la raíz del sitio y no desde /dev/.

     Sin data-access="full", esta URL mostraría la rejilla de cursos con
     la mitad en "Próximamente" — igual que https://memofun.apptonomia.uk/,
     que es justo lo que NO se quiere en /dev/.

     El <head> es a mano y NO lleva los marcadores build:head:start/end a
     propósito: scripts/build-head.js solo regenera index.html, así que
     un bloque generado aquí quedaría congelado (y con robots:index, que
     es justo lo contrario de lo que quiere una página de desarrollo).

     El cajón de idioma reutiliza assets/js/locale-picker-config.js tal
     cual: su `path: null` desactiva el descubrimiento por HEAD, así que
     no busca strings en /dev/ y las etiquetas le salen de requiredLocales.

     Los enlaces a config/ y legal/ son relativos a la raíz: en producción
     /dev/ cuelga del mismo dominio, y apuntar a rutas relativas del sitio
     equivocaría al sitio equivocado. Los /dev/ de los hermanos van por
     dominio completo, para que esta página no quede en un callejón sin
     salida al revisar los cursos bloqueados.

     Ojo con "Volver": los enlaces que construye app.js llevan BASE (raíz
     del sitio), no /dev/. Al entrar en un curso y pulsar "Volver" se vuelve
     a la portada pública, no a esta página. Es intencionado — el espejo no
     se propaga por los query params, y así el visor de tarjetas y su
     enlace "Volver" no necesitan ningún caso especial. Lo único que cambia
     al volver es la pantalla: allí el curso que estabas viendo aparece
     bloqueado en la rejilla, aunque la lista de asignaturas siga abierta.

     Esta página sustituye al /dev/ hardcodeado de los commits
     60b6075/71b5c4d/9097030/941e9bb: aquella aproximación duplicaba el
     estado del manifest y se desfasaba en cuanto se añadía una asignatura.
     Aquí app.js es la única fuente de verdad: si el manifest añade un curso
     o una asignatura, esta página lo refleja automáticamente, y los iconos,
     las traducciones y la cuenta de tarjetas los pone app.js sin tener
     que mantenerlos a mano en este HTML.
     ============================================================================ -->
