<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memofun</title>
<meta name="description" content="Memofun: practica con tarjetas de memoria pensadas para el aprendizaje significativo." data-i18n-meta="home.tagline">
<meta name="theme-color" content="#FAF7F2">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/componentes.css">
</head>
<body>

<a class="skip-link" href="#contenido" data-i18n="core.skipToContent">Ir al contenido</a>

<header class="app-header">
  <div class="top-bar container">
    <div class="language-selector" role="group" aria-label="Elegir idioma">
      <button type="button" class="btn-lang" id="lang-es" data-locale="es" aria-pressed="false">🇪🇸 Español</button>
      <button type="button" class="btn-lang" id="lang-en" data-locale="en" aria-pressed="false">🇬🇧 English</button>
    </div>
    <span class="stars" id="stars-total">⭐ 0</span>
  </div>
  <div class="app-hero container">
    <img src="assets/img/icono.svg" alt="" width="64" height="64">
    <div class="logo">Memofun</div>
    <p class="tagline" data-i18n="home.tagline">Elige una baraja y practica con tarjetas.</p>
  </div>
</header>

<main id="contenido" class="container">
  <div id="deck-grid" aria-live="polite"></div>
</main>

<footer class="app-footer">
  <div class="container">
    <p>
      <a href="settings/" data-i18n="core.settings">Ajustes</a>
      · <a href="legal/" data-i18n="core.dataProtection">Protección de datos</a>
    </p>
  </div>
</footer>

<script src="assets/js/utils.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/tts.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/feedback.js"></script>
<script src="assets/js/deck-loader.js"></script>
<script src="strings.es.js"></script>
<script src="strings.en.js"></script>
<script src="app.js"></script>

</body>
</html>
