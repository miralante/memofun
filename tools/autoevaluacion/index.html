<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memofun</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/css/suite-base.css">
  <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/componentes.css">
<link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
</head>
<body>

<a class="skip-link" href="#contenido" data-i18n="core.skipToContent">Ir al contenido</a>

<div class="container">
  <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-name="Memofun" data-suite-byline></div>
  <div class="suite-chrome-activity" data-suite-activity>
  <a class="back-link" id="btn-back" href="../../" data-i18n="core.back">← Volver</a>
  <h1 id="test-title"></h1>
</div>

<main id="contenido" class="suite-body test-wrap">
  <p id="test-status" class="empty-state" data-i18n="test.loading">Cargando la autoevaluación…</p>

  <form id="test-form" class="hidden" novalidate>
    <p id="test-intro" class="test-intro"></p>
    <div id="test-questions"></div>
    <div class="btn-row">
      <button id="btn-check" class="btn" type="button" data-i18n="test.check">✅ Comprobar</button>
      <button id="btn-fix-wrong" class="btn secondary hidden" type="button" data-i18n="test.fixWrong">✏️ Corregir solo los errores</button>
      <button id="btn-retry" class="btn secondary hidden" type="button" data-i18n="test.retry">🔁 Repetir</button>
      <a id="btn-end" class="btn secondary hidden" href="../../" data-i18n="test.end">🏁 Terminar</a>
    </div>
    <p id="test-result" class="test-result" aria-live="polite"></p>
  </form>
</main>
  <footer data-suite-footer data-suite-base="../../"></footer>
</div>

<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="strings.es.js"></script>
<script src="strings.en.js"></script>
<script src="app.js"></script>

  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
