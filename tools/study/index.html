<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memofun</title>
<meta name="theme-color" content="#FAF7F2">
<link rel="manifest" href="../../manifest.json">
<link rel="icon" href="../../assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/css/suite-base.css">
  <link rel="stylesheet" href="../../assets/css/brand.css">
  <link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/componentes.css">
  <link rel="stylesheet" href="../../assets/css/locale-picker.css">
</head>
<body>

<a class="skip-link" href="#contenido" data-i18n="core.skipToContent">Ir al contenido</a>

<div class="container">
  <div data-suite-header data-suite-logo="../../assets/img/icono.svg" data-suite-name="Memofun" data-suite-byline></div>
  <div class="suite-chrome-activity" data-suite-activity>
  <a class="back-link" id="btn-back" href="../../" data-i18n="core.back">← Volver</a>
  <h1 id="deck-title"></h1>
  <p id="deck-context" class="deck-context hidden"></p>
</div>

<main id="contenido" class="suite-body flashcard-wrap">
  <span class="stars" data-suite-stars id="stars-total">⭐ 0</span>
  <div id="study-status" class="empty-state" data-i18n="study.loading">Cargando la baraja…</div>

  <div id="study-area" class="hidden">
    <div class="progress-row">
      <div class="progress-bar" data-suite-progress role="progressbar" aria-label="Study progress">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-label" id="progress-label" aria-hidden="true"></span>
    </div>
    <div id="progress" class="sr-only" aria-live="polite"></div>

    <div id="flashcard" class="flashcard" aria-live="polite"></div>

    <div class="flashcard-controls">
      <button id="btn-prev" class="btn secondary icon" type="button" aria-label="Anterior" data-i18n-aria="core.previous">‹</button>
      <button id="btn-reveal" class="btn icon" type="button" aria-label="Ver respuesta" data-i18n-aria="study.showAnswer">👀</button>
      <button id="btn-next" class="btn icon" type="button" aria-label="Siguiente" data-i18n-aria="core.next">›</button>
    </div>
  </div>

  <!-- End screen: persistent, no auto-redirect — the person decides
       when to leave (SPEC.md §2.7 autonomy). -->
  <div id="end-screen" class="end-screen hidden">
    <h2 data-i18n="study.doneTitle">¡Has repasado toda la baraja!</h2>
    <p id="end-reward" class="end-reward"></p>
    <p id="achievement-notice" class="achievement-notice" aria-live="polite"></p>
    <div class="btn-row">
      <button id="btn-study-again" class="btn" type="button" data-i18n="study.studyAgain">Repasar otra vez</button>
    </div>
  </div>
</main>
  <footer data-suite-footer data-suite-base="../../"></footer>
</div>

<script src="../../assets/js/utils.js"></script>
<script src="../../assets/js/i18n.js"></script>
<script src="../../assets/js/storage.js"></script>
<script src="../../assets/js/feedback.js"></script>
<script src="../../assets/js/deck-loader.js"></script>
<script src="../../assets/js/achievements-engine.js"></script>
<script src="../../assets/js/achievements.js"></script>
<script src="strings.es.js"></script>
<script src="strings.en.js"></script>
<script src="../../assets/js/stars-engine.js"></script>
<script src="app.js"></script>

  <script src="../../assets/js/locale-picker-config.js"></script>
  <script src="../../assets/js/locale-picker.js" defer></script>
  <script src="../../assets/js/suite-chrome.js"></script>
</body>
</html>
