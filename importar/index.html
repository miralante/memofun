<!DOCTYPE html>
<html lang="es" data-i18n-title="import.title">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memofun</title>
<meta name="theme-color" content="#FAF7F2">
<!-- Hidden route: not linked from the home screen. It reviews a personal deck
     file on the device, without saving it. -->
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../assets/img/icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/css/suite-base.css">
<link rel="stylesheet" href="../assets/css/brand.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/base.css">
<link rel="stylesheet" href="../assets/css/componentes.css">
<link rel="stylesheet" href="../assets/css/locale-picker.css">
</head>
<body>

<a class="skip-link" href="#contenido" data-i18n="core.skipToContent">Ir al contenido</a>

<div class="container">
  <div data-suite-header data-suite-logo="../assets/img/icono.svg" data-suite-name="Memofun" data-suite-byline></div>
  <div class="suite-chrome-activity" data-suite-activity>
  <a href="../" class="back-link" data-i18n="core.back">Menú de Teclatlon</a>
  <h1 data-i18n="import.title">Repasar una baraja propia</h1>
</div>
<main id="contenido" class="suite-body">
  <section class="panel">
    <p class="tagline" data-i18n="import.hint">Abre cualquier archivo .json de baraja para repasarlo aquí, sin guardarlo.</p>

    <div id="dropzone" class="dropzone" tabindex="0" role="button" data-i18n-aria="import.dropHint" aria-label="Toca o arrastra un archivo .json">
      <span data-i18n="import.dropHint">Toca o arrastra un archivo .json de baraja</span>
      <input id="file-input" type="file" accept=".json" hidden>
    </div>
    <div id="import-status" class="feedback-zone hidden" role="status"></div>

    <div id="import-viewer" class="hidden" style="margin-top: var(--space-2);">
      <div id="progress" class="flashcard-progress" aria-live="polite"></div>
      <div id="flashcard" class="flashcard" tabindex="0" role="button" aria-live="polite"></div>
      <div class="flashcard-controls">
        <button id="btn-prev" class="btn secondary" type="button" data-i18n="core.previous">← Anterior</button>
        <button id="btn-next" class="btn secondary" type="button" data-i18n="core.next">Siguiente →</button>
      </div>
    </div>
  </section>
</main>

<footer data-suite-footer data-suite-base="../"></footer>
</div>

<script src="../assets/js/utils.js"></script>
<script src="../assets/js/i18n.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/feedback.js"></script>
<script src="../assets/js/deck-loader.js"></script>
<script src="../strings.es.js"></script>
<script src="../strings.en.js"></script>
<script src="strings.es.js"></script>
<script src="strings.en.js"></script>
<script src="app.js"></script>

  <script src="../assets/js/locale-picker-config.js"></script>
  <script src="../assets/js/locale-picker.js" defer></script>
  <script src="../assets/js/suite-chrome.js"></script>
</body>
</html>
